[pytest]
# Пути к тестам
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Настройки Allure
addopts = 
    --alluredir=allure-results
    --strict-markers
    -v
    --tb=short
    --color=yes

# Маркеры для тестов
markers =
    slow: Медленные тесты (требуют ожидания)
    fast: Быстрые тесты
    calculator: Тесты калькулятора
    shop: Тесты магазина
    smoke: Smoke тестирование
    e2e: End-to-end тесты
    regression: Регрессионное тестирование

# Настройки логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Настройки для отчетов
junit_family = xunit2
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning